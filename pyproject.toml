[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffagent"
version = "0.1.0"
description = "Fantasy football consultant and agent for Sleeper and ESPN leagues, powered by Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ffagent = "ffagent.cli:main"

[tool.setuptools.packages.find]
include = ["ffagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
